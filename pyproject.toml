[project]
name = "text_adventure_engine"
version = "0.1.0"
description = "Modular text-based adventure engine with branching narratives, state, and extensibility."
authors = [ { name = "Author" } ]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["text", "adventure", "game", "engine", "interactive-fiction", "narrative"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Intended Audience :: Developers",
	"Topic :: Games/Entertainment",
	"Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
	"pytest",
	"pytest-cov",
	"mypy",
	"coverage",
	"pre-commit",
]

[project.scripts]
text-adventure = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
