repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        types: [python]



      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint-cli "**/*.md" --config .markdownlint.json
        language: system
        files: \.(md|MD)$
